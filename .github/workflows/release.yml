name: Desktop release packages
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build
        required: true
        type: string
permissions:
  contents: read
jobs:
  windows:
    uses: ./.github/workflows/windows.yml
    with:
      ref: ${{ inputs.tag }}
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check version tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node --input-type=module -e "import fs from 'node:fs'; import assert from 'node:assert/strict'; const v=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json')).version; assert.equal(process.env.RELEASE_TAG, 'v'+v); assert.match(v, /^\d+\.\d+\.\d+(-[\w.]+)?$/)"
      - name: Install desktop build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - run: npm ci
      - run: npm test
      - run: cargo test --workspace --locked
      - run: npm run package:linux
      - name: Verify fresh install, legacy upgrade and coexistence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/legacy
          gh release download v0.3.0 --pattern 'Parley_0.3.0_amd64.deb' --pattern SHA256SUMS --dir artifacts/legacy
          (cd artifacts/legacy && sha256sum -c SHA256SUMS)
          bash scripts/test-deb-install.sh target/release/bundle/deb/ParleyDesktop_*.deb artifacts/legacy/Parley_0.3.0_amd64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: parley-linux-amd64
          path: |
            target/release/bundle/deb/ParleyDesktop_*.deb
            target/release/bundle/deb/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
  draft:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: parley-*
          path: packages
          merge-multiple: true
      - name: Create a draft release with both platforms
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          cd packages
          sha256sum -c SHA256SUMS
          sha256sum -c SHA256SUMS-windows-x64
          if gh release view "$RELEASE_TAG" --json isDraft > release.json; then
            jq -e '.isDraft == true' release.json
          else
            flags=()
            if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "Parley $RELEASE_TAG" "${flags[@]}"
          fi
          gh release upload "$RELEASE_TAG" ParleyDesktop_*.deb *-setup.exe SHA256SUMS SHA256SUMS-windows-x64 --clobber
