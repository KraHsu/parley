name: Workspace checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm run test
      - run: cargo test --workspace --locked
      - name: Verify Windows npm Codex startup without model calls
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP 'parley codex 中文'
          npm install --global --prefix "$prefix" --include=optional --no-audit --no-fund @openai/codex@0.154.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:CODEX_HOME = Join-Path $env:RUNNER_TEMP 'parley-codex-test-home'
          New-Item -ItemType Directory -Force $env:CODEX_HOME | Out-Null
          $env:PARLEY_TEST_CODEX_BIN = Join-Path $prefix 'codex'
          cargo test --lib live_codex_connection --locked -- --ignored
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npm run desktop:check -- -- --locked
